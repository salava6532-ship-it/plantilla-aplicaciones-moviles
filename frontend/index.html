<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Gestión de Citas</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <div class="app-container">

    <!-- CONTENIDO PRINCIPAL -->
    <main class="main-content">

      <!-- TOP BAR -->
      <div class="topbar">
        <h1 class="topbar-title">Gestión de citas</h1>
        <!-- Usuario se agrega dinámicamente desde JS -->
      </div>

      <hr class="divider" />
<div id="msg" style="color: #666; font-size: 14px; margin-bottom: 10px;"></div>
      <!-- ENCABEZADO -->
      <header class="header">
        <div>
          <h2 class="subtitle">Mis citas</h2>
        </div>
        <button id="btnAgregar" class="btn-primary">+ Agregar cita</button>
      </header>

      <!-- FILTROS -->
      <section class="filters">
        <button class="filter-btn active" data-estado="todas">Todas</button>
        <button class="filter-btn" data-estado="pendiente">Pendientes</button>
        <button class="filter-btn" data-estado="confirmada">Confirmadas</button>
        <button class="filter-btn" data-estado="cancelada">Canceladas</button>
      </section>

      <!-- LISTADO DE CITAS -->
      <section id="citasContainer" class="citas-container">
        <!-- JS insertará las citas aquí -->
      </section>

    </main>
  </div>

  <!-- MODAL NUEVA CITA -->
  <div id="modalCita" class="modal hidden">
    <div class="modal-content">
      <h2>Nueva cita</h2>

      <form id="formCita">
        <div class="form-group">
          <label>Cliente *</label>
          <input type="text" id="cliente" required placeholder="Nombre del cliente">
        </div>
        <div class="form-group">
          <label>Fecha *</label>
          <input type="date" id="fecha" required>
        </div>
        <div class="form-group">
          <label>Hora *</label>
          <input type="time" id="hora" required>
        </div>
        <div class="form-group">
          <label>Descripción</label>
          <textarea id="descripcion" placeholder="Motivo de la cita"></textarea>
        </div>
        <div class="form-group">
          <label>Estado</label>
          <select id="estado">
            <option value="pendiente">Pendiente</option>
            <option value="confirmada">Confirmada</option>
            <option value="cancelada">Cancelada</option>
          </select>
        </div>
        <div class="modal-actions">
          <button type="submit" class="btn-primary">Crear</button>
          <button type="button" id="btnCerrarModal" class="btn-cancel">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL LOGIN / REGISTRO -->
  <div id="modalAuth" class="modal hidden">
    <div class="modal-content">
      <span id="btnCerrarAuth" class="close">&times;</span>
      <h2 id="authTitle">Iniciar sesión</h2>

      <form id="formAuth">
        <div id="grupoNombre" class="form-group" style="display: none;">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" />
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="email@dominio.com" required />
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="Contraseña" required />
        </div>

        <button type="submit" class="btn-primary">Enviar</button>
      </form>

      <p>
        <a href="#" id="toggleAuth">¿No tienes cuenta? Regístrate</a>
      </p>
    </div>
  </div>

  <!-- JS -->
  <script src="js/app.js"></script>
  <script src="cordova.js"></script>

</body>
</html>
